[package]
name = "togglr-sdk"
version = "1.1.0"
edition = "2024"
authors = ["Roman <roman.chudov@gmail.com>"]
description = "Rust SDK for Togglr feature flag management system"
license = "MIT"
repository = "https://github.com/togglr-project/togglr-sdk-rust"
keywords = ["feature-flags", "togglr", "sdk"]
categories = ["api-bindings", "development-tools"]

include = [
    "src/**",
    "generated/src/**",
    "Cargo.toml",
    "README.md",
]

[dependencies]
# Generated OpenAPI client
togglr_sdk_generated = { path = "generated" }

# HTTP client
reqwest = { version = "0.12.24", features = ["json", "rustls-tls", "native-tls"] }
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

# Retry logic
backoff = "0.4"

# Caching
lru = "0.16.2"

# Logging
log = "0.4.28"
tracing = "0.1.41"

# Error handling
thiserror = "1.0.69"
anyhow = "1.0"

# TLS
rustls = "0.23.33"
rustls-pemfile = "2.0"
webpki-roots = "0.26"

[dev-dependencies]
tokio-test = "0.4.4"
env_logger = "0.11.8"
